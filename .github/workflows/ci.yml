name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    name: test
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npx tsc --noEmit
      - run: node desktop/build.cjs
