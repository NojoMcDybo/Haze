# Baut den Windows-Installer aus main und haengt ihn an ein GitHub Release.
# Ausloeser: Tag v<version> auf main pushen (muss zur Version in package.json passen),
# oder manuell unter Actions > Release > Run workflow (baut die aktuelle Version).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Version pruefen
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zur Version $version in package.json"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: npm ci --include=dev
      - run: npm test
      - run: powershell -ExecutionPolicy Bypass -File desktop/native-glass/build.ps1
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Release anlegen und Installer hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $exe = Get-ChildItem release/Haze-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "Haze $($env:TAG.TrimStart('v'))" --notes "Windows-Installer (x64, NSIS), gebaut aus main.`n`nSHA-256: ``$hash``"
          }
          gh release upload $env:TAG $exe.FullName --clobber
